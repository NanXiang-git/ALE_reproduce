onkey travel': r['text']=''\n if r['title']=='Monkey speaks': r['text']='Japanese dialogue card includes 萬事お委せなさい (“Leave everything to me”).'\n# A short excerpt avoids uncertain small characters in the longer dialogue card.\nfor r in rows:\n if r['title']=='Dialogue across the ledge':\n  r['text']='The long card begins 冗談ぢゃありませんよ and includes 貴方を山羊の居る川向へお渡し申さうと思ってやって來たのです. The next card reads さうか 宜しい すぐ案内せい.'\nPath('work/log.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')\nW='http://schemas.openxmlformats.org/wordprocessingml/2006/main'\ndef esc(t): return html.escape(t,quote=False)\ndef p(t,style='Normal',keep=False):\n return '\u003cw:p>\u003cw:pPr>\u003cw:pStyle w:val=\"'+style+'\"/>'+('\u003cw:keepNext/>' if keep else '')+'\u003c/w:pPr>\u003cw:r>\u003cw:t xml:space=\"preserve\">'+esc(t)+'\u003c/w:t>\u003c/w:r>\u003c/w:p>'\nbody=p('ARCHIVAL SHOT LOG / CONTINUITY REPORT','Title')+p('A Wolf is a Wolf · source-print visual record','Subtitle')\nbody+=p('Source: Yasuji_Murata-_A_Wolf_is_a_Wolf_(1931).ogv | 400 × 300 | running time 11:16.224.','Meta')\nbody+=p('Elapsed times run from the first source frame, including access titles and closing credits. Boundaries are approximate to the nearest second; fades and closely related cuts are grouped as segments. Japanese excerpts identify visible intertitles; English glosses describe the lettering, not independently verified events. The black-and-white print carries an NFC mark at lower right through most of the film.','Meta')\n# Automatic pagination, with each segment kept as a readable block.\nfor i,r in enumerate(rows,1):\n body+=p(f'S{i:02d}   {r[\"start\"]} – {r[\"end\"]}   |   {r[\"title\"]}','Heading2',True)\n body+=p(r['body'],'Normal',bool(r['text']))\n if r['text']: body+=p('On screen: '+r['text'],'TextNote')\nbody+='\u003cw:sectPr>\u003cw:headerReference w:type=\"default\" r:id=\"rId2\"/>\u003cw:footerReference w:type=\"default\" r:id=\"rId3\"/>\u003cw:pgSz w:w=\"11906\" w:h=\"16838\"/>\u003cw:pgMar w:top=\"1000\" w:right=\"1050\" w:bottom=\"1000\" w:left=\"1050\" w:header=\"450\" w:footer=\"450\"/>\u003c/w:sectPr>'\ndocument='\u003c?xml version=\"1.0\" encoding=\"UTF-8\" standalone=\"yes\"?>\u003cw:document xmlns:w=\"'+W+'\" xmlns:r=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships\">\u003cw:body>'+body+'\u003c/w:body>\u003c/w:document>'\nstyles='''\u003cw:styles xmlns:w=\"'''+W+'''\">\u003cw:docDefaults>\u003cw:rPrDefault>\u003cw:rPr>\u003cw:rFonts w:ascii=\"Calibri\" w:hAnsi=\"Calibri\" w:eastAsia=\"Yu Mincho\"/>\u003cw:sz w:val=\"21\"/>\u003cw:lang w:val=\"en-US\" w:eastAsia=\"ja-JP\"/>\u003c/w:rPr>\u003c/w:rPrDefault>\u003cw:pPrDefault>\u003cw:pPr>\u003cw:spacing w:after=\"85\" w:line=\"260\" w:lineRule=\"auto\"/>\u003cw:widowControl/>\u003c/w:pPr>\u003c/w:pPrDefault>\u003c/w:docDefaults>\n\u003cw:style w:type=\"paragraph\" w:default=\"1\" w:styleId=\"Normal\">\u003cw:name w:val=\"Normal\"/>\u003c/w:style>\n\u003cw:style w:type=\"paragraph\" w:styleId=\"Title\">\u003cw:name w:val=\"Title\"/>\u003cw:pPr>\u003cw:spacing w:after=\"140\"/>\u003c/w:pPr>\u003cw:rPr>\u003cw:b/>\u003cw:color w:val=\"1D384D\"/>\u003cw:sz w:val=\"34\"/>\u003c/w:rPr>\u003c/w:style>\n\u003cw:style w:type=\"paragraph\" w:styleId=\"Subtitle\">\u003cw:name w:val=\"Subtitle\"/>\u003cw:rPr>\u003cw:sz w:val=\"27\"/>\u003cw:color w:val=\"36596E\"/>\u003c/w:rPr>\u003c/w:style>\n\u003cw:style w:type=\"paragraph\" w:styleId=\"Meta\">\u003cw:name w:val=\"Meta\"/>\u003cw:rPr>\u003cw:sz w:val=\"19\"/>\u003cw:color w:val=\"4C5560\"/>\u003c/w:rPr>\u003c/w:style>\n\u003cw:style w:type=\"paragraph\" w:styleId=\"Heading2\">\u003cw:name w:val=\"Heading 2\"/>\u003cw:pPr>\u003cw:keepNext/>\u003cw:spacing w:before=\"150\" w:after=\"55\"/>\u003cw:outlineLvl w:val=\"1\"/>\u003c/w:pPr>\u003cw:rPr>\u003cw:b/>\u003cw:color w:val=\"1D384D\"/>\u003cw:sz w:val=\"22\"/>\u003c/w:rPr>\u003c/w:style>\n\u003cw:style w:type=\"paragraph\" w:styleId=\"TextNote\">\u003cw:name w:val=\"On-screen text\"/>\u003cw:pPr>\u003cw:ind w:left=\"180\"/>\u003cw:spacing w:after=\"105\"/>\u003c/w:pPr>\u003cw:rPr>\u003cw:sz w:val=\"20\"/>\u003c/w:rPr>\u003c/w:style>\u003c/w:styles>'''\nheader='\u003cw:hdr xmlns:w=\"'+W+'\">'+p('A WOLF IS A WOLF  |  SOURCE-PRINT CONTINUITY','Meta')+'\u003c/w:hdr>'\nfooter='\u003cw:ftr xmlns:w=\"'+W+'\">\u003cw:p>\u003cw:pPr>\u003cw:jc w:val=\"right\"/>\u003c/w:pPr>\u003cw:r>\u003cw:t>Shot log · \u003c/w:t>\u003c/w:r>\u003cw:fldSimple w:instr=\"PAGE\"/>\u003c/w:p>\u003c/w:ftr>'\nrels='''\u003cRelationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\u003cRelationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/styles\" Target=\"styles.xml\"/>\u003cRelationship Id=\"rId2\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/header\" Target=\"header1.xml\"/>\u003cRelationship Id=\"rId3\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/footer\" Target=\"footer1.xml\"/>\u003c/Relationships>'''\nrootrels='''\u003cRelationships xmlns=\"http://schemas.openxmlformats.org/package/2006/relationships\">\u003cRelationship Id=\"rId1\" Type=\"http://schemas.openxmlformats.org/officeDocument/2006/relationships/officeDocument\" Target=\"word/document.xml\"/>\u003c/Relationships>'''\ntypes='''\u003cTypes xmlns=\"http://schemas.openxmlformats.org/package/2006/content-types\">\u003cDefault Extension=\"rels\" ContentType=\"application/vnd.openxmlformats-package.relationships+xml\"/>\u003cDefault Extension=\"xml\" ContentType=\"application/xml\"/>\u003cOverride PartName=\"/word/document.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.document.main+xml\"/>\u003cOverride PartName=\"/word/styles.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.styles+xml\"/>\u003cOverride PartName=\"/word/header1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.header+xml\"/>\u003cOverride PartName=\"/word/footer1.xml\" ContentType=\"application/vnd.openxmlformats-officedocument.wordprocessingml.footer+xml\"/>\u003c/Types>'''\nfiles={'[Content_Types].xml':types,'_rels/.rels':rootrels,'word/document.xml':document,'word/styles.xml':styles,'word/header1.xml':header,'word/footer1.xml':footer,'word/_rels/document.xml.rels':rels}\nPath('output').mkdir(exist_ok=True)\nwith zipfile.ZipFile('output/storyboard.docx','w',zipfile.ZIP_DEFLATED) as z:\n for name,data in files.items():\n  ET.fromstring(data)\n  z.writestr(name,data.encode('utf-8'))\nwith zipfile.ZipFile('output/storyboard.docx') as z:\n assert z.testzip() is None\n root=ET.fromstring(z.read('word/document.xml'))\n assert sum(1 for p0 in root.findall('.//{'+W+'}p') if p0.find('{'+W+'}pPr/{'+W+'}pStyle').get('{'+W+'}val')=='Heading2')==60\nprint('Validated DOCX package:',Path('output/storyboard.docx').stat().st_size,'bytes; 60 segments')\n","file":"files/video_storyboard_001/build_doc.py"},{"name":"content.py","code":"import json\nfrom pathlib import Path\n# Times are elapsed source time; adjacent ranges share their boundary.\nrows=[]\ndef add(a,b,title,body,text=''):\n rows.append(dict(start=a,end=b,title=title,body=body,text=text))\nadd('00:00','00:05','Opening identification','White bilingual lettering on black.','“漫画 狼は狼だ”; “A Wolf is a Wolf”; “(1931, Yasuji Murata, 11 min)”.')\nadd('00:05','00:12','Production card','A bordered Japanese credit card fades up and down; an NFC mark appears at lower right.','Right-to-left horizontal production lettering: 文部省製作.')\nadd('00:12','00:22','Illustrated title and credit','A large black wolf stands over small animal silhouettes, including monkeys. The title fades to a Japanese animation credit and then dark frames.','Title: 狼は狼だ (set right to left); animation credit names 村田安司.')\nadd('00:22','00:29','Village establishing view','Thatched rooftops, fence, bare branches and a tree bearing round fruit. Dissolve to a road outside a house with an open shuttered window and hedge.')\nadd('00:29','00:45','Two animals outside the house','A thin, horned, bearded goat faces a round, dark-eye-marked, long-tailed animal (raccoon dog). They gesture; the round animal raises both arms. The goat walks left and the round animal follows.')\nadd('00:45','01:10','Forest walk and fright','The goat leads among tall bare trunks. Behind it the round animal leaps and briefly becomes a dark, upright, toothy figure. The goat falls backward with stars around its head, gets up and gestures. The round animal returns to its pale, rounded shape. An iris isolates it.')\nadd('01:10','01:15','Forest dialogue card','Vertical Japanese lettering on black, followed by an iris returning to the round animal.','もう威かさないから 勘辨しておくれよ……')\nadd('01:15','01:34','Walking toward the fruit tree','The goat rejoins the round animal. They gesture and walk left. A cutaway shows many round fruits on bare branches, then dissolves to the two animals on either side of the trunk.')\nadd('01:34','01:47','Falling fruit','The round animal moves against the tree. Fruit drops and piles around both animals. They sit near the trunk and lift fruit toward their mouths; more fruit falls.')\nadd('01:47','02:00','Wolf in the woods','A black wolf with pointed ears, long muzzle, visible teeth and bushy tail walks right on four legs. Tracking views carry it behind and between tree trunks.')\nadd('02:00','02:14','Fruit eaters and approaching wolf','The goat and round animal sit amid fallen fruit, eating and looking up. Cut back to the wolf continuing right; it reaches a rocky drop and lowers its head over the edge.')\nadd('02:14','02:23','Animals scatter','Back at the fruit tree, the goat runs away. The round animal remains briefly, then jumps right as the wolf rushes in. Cuts alternate the fleeing round animal with the wolf crouched near the trunk.')\nadd('02:23','02:37','Pursuit to the rocks','The wolf bounds right through the forest after the round animal. At a pile of stones, the round animal curls into a ball. The wolf arrives, rises on its hind legs and strikes/kicks the ball, sending it away.')\nadd('02:37','02:45','Rolling down the slope','The ball-shaped animal rolls along sloping ground and hits a tree; stars appear around it. It opens back into its rounded animal form at the base of the trunk.')\nadd('02:45','03:01','Wolf returns to the fruit tree','The wolf turns near the rocks, then runs back to the fruit-strewn tree, lowers its head to the ground and moves off left. The empty clearing fades to black.')\nadd('03:01','03:08','Meeting intertitle','Vertical Japanese narration on black.','其の夜、暴虐な狼に對する對抗策を協議する爲に村會が開かれました (card describing a village meeting about measures against the wolf).')\nadd('03:08','03:30','Animals seated in a room','A group sits in a circle under a hanging lamp, with sliding doors behind. Closer views pan across a dog, bearded/horned animals, and round animals, several resting heads on hands. The dark-eye-marked round animal raises its head, then stands.')\nadd('03:30','03:42','Standing speaker','A dialogue card interrupts the meeting. Back in the room, the round animal gestures, raises its arms and displays a small leaf-like object. A second card follows.','03:30–03:34: あ、さうだ 好い考へがある あっしにお委せ下さい; 03:39–03:41: どうです こんな風にやって……')\nadd('03:42','03:54','Transformation demonstration','The standing animal becomes a tall pale figure with an enlarged head, large eyes and long hanging tentacle-like strips below. The seated animals recoil. It returns to its round form, hands on hips, and is isolated by an iris.','03:47–03:52 card includes これで狼の奴を威しておいて、きっと生捕にしてお目にかけます.')\nadd('03:54','04:10','Next morning; travel','Dark frames and a short intertitle lead to the round animal walking in the forest with a cloth tied at its neck. A distant view shows it on a path through open hills.','翌朝 (“next morning”).')\nadd('04:10','04:30','Wolf above the mountain path','The wolf sits atop a high, cracked rock. Alternating views show the round animal walking below a rock wall and on a winding mountainside path. The wolf rises, jumps from its perch, and lands among large angular rocks.')\nadd('04:30','04:47','Encounter among rocks','The round animal continues along the cliff base. The wolf is revealed beside a rock, followed by a close view of its eyes and grinning mouth. An iris shows the round animal raising an arm.','04:45–04:47: やい狼！')\nadd('04:47','04:59','Changing shapes','At the rock wall the round animal stretches into a taller pale quadruped-like animal standing upright. Cuts show the wolf advancing. The tall shape collapses back into the round animal, which bends to the ground.')\nadd('04:59','05:13','Tall pale apparition and wolf','The round animal becomes the large-eyed, tentacle-skirted figure again. The wolf walks past it, turns, crouches and bares its teeth. The pale figure opens its mouth; the wolf leaps toward it.','05:11–05:12: しまった！')\nadd('05:13','05:32','Return to the waiting group','The round animal, back in its ordinary shape with neck cloth, walks away along the rocks and through the forest with its head lowered. A group including a rabbit, dog and round animals waits by a tree at the village edge. It approaches them.')\nadd('05:32','05:48','Group exchange','Iris views isolate the dog gesturing and then the round animal bowing, clutching its cloth and gesturing with one hand. The wider group faces it. The scene fades out.')\nadd('05:48','06:07','Season change','A Japanese card dissolves over a broad mountain valley with a small cluster of buildings. A dissolve changes the dark, largely bare valley into a pale, snow-covered landscape; fade to dark.','秋も過ぎて 冬がおとづれました (autumn passes and winter arrives).')\nadd('06:07','06:23','Village yard and lookout','In front of a large building, rabbits hold hands in a ring while other animals form a curved line. A squirrel with a large upright bushy tail sits in a tree. It looks through a long telescope at the yard, lowers it, turns and looks toward the mountains.')\nadd('06:23','06:37','Telescope view of snowy mountains','A circular view pans across snow-covered peaks and slopes. A dotted trail crosses the snow. At the lower edge, the black wolf comes into view moving along the slope.')\nadd('06:37','06:44','Squirrel gives warning','The squirrel leaves the branch, lands by the trunk and opens its mouth with radiating marks. A Japanese warning card appears; the squirrel is then shown calling again.','狼が山を下りて來たぞーッ (“The wolf has come down the mountain!”).')\nadd('06:44','06:55','Yard dispersal; wolf descends','Rabbits tumble and run from the yard; larger animals also hurry away past the building. Cut to the wolf walking right over snow at the foot of a wooded, rocky hillside, leaving dark pawprints.')\nadd('06:55','07:01','Squirrel on house ladder','The bushy-tailed squirrel climbs a vertical wooden ladder fixed against a house wall. It stops on a projecting rung/platform beneath a small roofed fixture, lifting an arm toward it.')\nadd('07:01','07:12','Animals hurry through the village','A large round animal and a smaller one move past thatched houses; the larger one repeatedly lifts its head and opens its mouth. Other animals run into view. A brief cut returns to the squirrel on the ladder.')\nadd('07:12','07:20','Interior fright and wolf entering village','A pale animal by a square opening in a raised floor jumps up. A cloud fills the room and the animal springs outside. Another animal runs beside a house. The wolf appears in a gap between buildings and runs across.')\nadd('07:20','07:30','Street transformations and barrel','A rabbit briefly appears in a spinning, compressed form. A larger pale animal looks around and moves down the street. Beside long boards leaning against a house, it bends by an upright wooden barrel and climbs into/onto it.')\nadd('07:30','07:41','Wolf advances; barrel tips','The wolf runs right between tree trunks. Back in the street, the round animal is perched in the barrel, its lower body dark. Three small animals approach and tumble; the barrel tips over, spilling the larger animal, now marked with a dark patch.')\nadd('07:41','07:52','Rabbit and dark monkey figure','A rabbit bounds over open ground, stops beside a house and bows forward. A dark, shadow-like monkey silhouette with a curled tail appears next to it. The figure rises and gestures; pale facial details become visible. Rabbit and monkey face each other, then move together.')\nadd('07:52','08:03','Rabbit and monkey travel','The rabbit and dark monkey move side by side across a bare landscape, then run along a village street past thatched houses. Briefly, two small pale animals are seen together in the street before the pair passes.')\nadd('08:03','08:16','At a house door','The rabbit and monkey stop outside a house beside a bare tree and fence. The rabbit bends and jumps against the closed door. A bearded, horned goat opens it; rabbit and monkey enter, and the door closes.')\nadd('08:16','08:26','Indoor exchange and monkey close-up','The goat sits on a raised step at left, the rabbit stands centrally, and the dark monkey gestures at right. A round hanging object and bundles are on the wall. A circular close-up reveals the monkey’s pale muzzle, eyes and long curled tail against its dark body.')\nadd('08:26','08:35','Monkey speaks','A dialogue card alternates with the monkey standing hands on hips in an iris. In the room the goat stands, and all three gesture.','ようごあす りっしに巧へがあるから萬事お委せなさい (Japanese dialogue card; the monkey’s speech includes a request to leave matters to it).')\nadd('08:35','08:44','Departure from house','The monkey walks out first and points ahead. Goat and rabbit follow to the doorway, raising their arms as the monkey continues right. Fade through black.')\nadd('08:44','08:54','Monkeys among mountain rocks','One dark monkey runs left over angular boulders below a steep rock wall. More monkeys enter behind it and climb across the rocks in the same direction.')\nadd('08:54','09:06','Wolf at a cliff edge','The wolf approaches a bare tree on a high rock ledge, then looks outward and down. A reverse wide view shows small pale animals watching from a distant cliff top. Back at the tree, the wolf rises and leans toward the drop.')\nadd('09:06','09:15','Monkey climbs to the wolf','The view moves down the steep rock face to monkeys on lower ledges. One climbs up to the rim beside the tree. An iris shows it gripping the cliff edge and lifting a hand toward the wolf.')\nadd('09:15','09:25','Cliffside dialogue','A greeting card is followed by an iris close-up of the wolf baring its teeth. A second card precedes the monkey raising a hand while holding the rock.','こんにちは 狼の大将！; なんだ 猿公が 好いところへ來たな…… そこ動くな！')\nadd('09:25','09:42','Dialogue across the ledge','A longer vertical Japanese card interrupts the exchange. It mentions 山羊 and 川向へ; iris views then return to monkey and wolf. Another short card follows.','The long card begins 冗談ぢゃありませんよ and includes 山羊の居る川向へお渡し申さうと思ってやって來たのです. The next card reads さうか 宜しい すぐ案内せい.')\nadd('09:42','09:49','Monkey reaches the tree ledge','The wolf waits upright beside the bare tree. The monkey pulls itself onto the ledge and points outward. Below, a row of monkeys gathers across the rocks and begins climbing.')\nadd('09:49','10:05','Monkeys link up the trunk','Monkeys climb the cliff and then the tree beside the wolf and lead monkey. They join one another in a long vertical chain against the trunk, with successive monkeys holding the next. An iris emphasizes their linked bodies.')\nadd('10:05','10:13','Living bridge spans the chasm','A wide view shows two sheer cliff edges separated by a deep open ravine. The long chain of monkeys extends from the tree on the left, swings downward and stretches across to the right rim, forming a sagging living bridge. The wolf and lead monkey remain at the left end.')\nadd('10:13','10:20','Lead monkey crosses','The lead monkey points across, then steps onto the linked monkeys and runs from left to right over their backs. It bends down toward one of the monkeys near the middle. The wolf remains behind at the departure ledge.')\nadd('10:20','10:28','Crossing completed','A short Japanese card interrupts the crossing. The lead monkey continues right, steps up onto the far cliff, turns back and gestures toward the bridge.','しっかり頼むよ.')\nadd('10:28','10:37','Wolf follows onto the bridge','Back beside the tree, the wolf walks to the left end of the living bridge and steps out onto the linked bodies. A side view shows it progressing right on the monkeys, first upright and then bent low.')\nadd('10:37','10:42','Wolf crouched above the drop','A downward insert shows scattered angular rocks far below. Back on the bridge the wolf crouches and grips downward; concentric rings appear around its body while it remains near the middle of the span.')\nadd('10:42','10:45','Signal from the far side','The lead monkey stands on the right cliff above the bridge end. It turns toward the span and raises both arms high. Cut to the wolf still crouched on the monkeys.')\nadd('10:45','10:48','Bridge opens; wolf falls','In a wide view the linked bridge separates beneath the wolf. The two chains hang from opposite sides, leaving an opening in the middle. The wolf drops between them into the ravine and passes out of view below.')\nadd('10:48','10:53','Animals at the rim','Pale animals, including long-eared rabbits, crowd along a high rocky rim and wave their raised arms. The image fades through black.')\nadd('10:53','11:03','Closing narration','Vertical Japanese lettering on black fades down.','それから 山の麓の村には再び幸福な日が返ってまいりました (closing narration about happy days returning to the village at the mountain’s foot).')\nadd('11:03','11:11','End title and black','The Japanese title returns above a large end character, then fades to black.','狼は狼だ (right-to-left setting); 終.')\nadd('11:11','11:16.224','Access credit','Bilingual white text on black fills the closing frames.','English credit states that the film was made available online through the National Project for the Sustainability of Born-Digital Cinema, supported by Japan’s Agency for Cultural Affairs in fiscal 2016; dated January 2017, National Film Center, The Museum of Modern Art, Tokyo.')\nPath('work/log.json').write_text(json.dumps(rows,ensure_ascii=False,indent=2),encoding='utf-8')\nprint(len(rows),'segments')\n","file":"files/video_storyboard_001/content.py"},{"name":"dense.py","code":"from PIL import Image,ImageDraw\nfrom pathlib import Path\nfs=sorted(Path('work').glob('sec_*.jpg'))\nfor s in range(0,len(fs),32):\n out=Image.new('RGB',(1600,8*322),'white'); d=ImageDraw.Draw(out)\n for j,f in enumerate(fs[s:s+32]):\n  t=int(f.stem.split('_')[1])-1;x=j%4*400;y=j//4*322\n  out.paste(Image.open(f),(x,y));d.text((x+5,y+301),f'{t//60:02}:{t%60:02}',fill='black')\n out.save(f'work/dense_{s//32:02}.jpg')\n","file":"files/video_storyboard_001/dense.py"},{"name":"sheets.py","code":"from PIL import Image,ImageDraw\nfrom pathlib import Path\nfs=list(Path('work').glob('frame_*.jpg'))\nfor s in range(0,len(fs),30):\n out=Image.new('RGB',(1600,6*325),'white'); d=ImageDraw.Draw(out)\n for j,f in enumerate(fs[s:s+30]):\n  im=Image.open(f); x=j%4*400; y=j//4*325\n  # 4 columns, 8 rows\n  if j==0: pass\n # rebuild\n out=Image.new('RGB',(1600,8*325),'white'); d=ImageDraw.Draw(out)\n for j,f in enumerate(fs[s:s+30]):\n  t=(int(f.stem.split('_')[1])-1)*3; x=j%4*400;y=j//4*325\n  out.paste(Image.open(f),(x,y));d.text((x+5,y+302),f'{t//60:02}:{t%60:02}',fill='black')\n out.save(f'work/sheet_{s//30:02}.jpg')\n","file":"files/video_storyboard_001/sheets.py"}],"files":{"grade":"files/video_storyboard_001/score.json","prompt":"files/video_storyboard_001/prompt.md","events":"files/video_storyboard_001/cli-events.jsonl","run":"files/video_storyboard_001/run.json","evaluator":"files/video_storyboard_001/official-evaluator.py","artifact":"files/storyboard.docx","qc":"files/video_storyboard_qa_set.docx","judge_prompt":"files/judge-prompt.txt","judge_response":"files/judge-response.json"},"document_text":"ARCHIVAL SHOT LOG / CONTINUITY REPORT\nA Wolf is a Wolf · source-print visual record\nSource: Yasuji_Murata-_A_Wolf_is_a_Wolf_(1931).ogv | 400 × 300 | running time 11:16.224.\nElapsed times run from the first source frame, including access titles and closing credits. Boundaries are approximate to the nearest second; fades and closely related cuts are grouped as segments. Japanese excerpts identify visible intertitles; English glosses describe the lettering, not independently verified events. The black-and-white print carries an NFC mark at lower right through most of the film.\nS01   00:00 – 00:05   |   Opening identification\nWhite bilingual lettering on black.\nOn screen: “漫画 狼は狼だ”; “A Wolf is a Wolf”; “(1931, Yasuji Murata, 11 min)”.\nS02   00:05 – 00:12   |   Production card\nA bordered Japanese credit card fades up and down; an NFC mark appears at lower right.\nOn screen: Right-to-left horizontal production lettering: 文部省製作.\nS03   00:12 – 00:22   |   Illustrated title and credit\nA large black wolf stands over small animal silhouettes, including monkeys. The title fades to a Japanese animation credit and then dark frames.\nOn screen: Title: 狼は狼だ (set right to left); animation credit names 村田安司.\nS04   00:22 – 00:29   |   Village establishing view\nThatched rooftops, fence, bare branches and a tree bearing round fruit. Dissolve to a road outside a house with an open shuttered window and hedge.\nS05   00:29 – 00:45   |   Two animals outside the house\nA thin, horned, bearded goat faces a round, dark-eye-marked, long-tailed animal (raccoon dog). They gesture; the round animal raises both arms. The goat walks left and the round animal follows.\nS06   00:45 – 01:10   |   Forest walk and fright\nThe goat leads among tall bare trunks. Behind it the round animal leaps and briefly becomes a dark, upright, toothy figure. The goat falls backward with stars around its head, gets up and gestures. The round animal returns to its pale, rounded shape. An iris isolates it.\nS07   01:10 – 01:15   |   Forest dialogue card\nVertical Japanese lettering on black, followed by an iris returning to the round animal.\nOn screen: もう威かさないから 勘辨しておくれよ……\nS08   01:15 – 01:34   |   Walking toward the fruit tree\nThe goat rejoins the round animal. They gesture and walk left. A cutaway shows many round fruits on bare branches, then dissolves to the two animals on either side of the trunk.\nS09   01:34 – 01:47   |   Falling fruit\nThe round animal moves against the tree. Fruit drops and piles around both animals. They sit near the trunk and lift fruit toward their mouths; more fruit falls.\nS10   01:47 – 02:00   |   Wolf in the woods\nA black wolf with pointed ears, long muzzle, visible teeth and bushy tail walks right on four legs. Tracking views carry it behind and between tree trunks.\nS11   02:00 – 02:14   |   Fruit eaters and approaching wolf\nThe goat and round animal sit amid fallen fruit, eating and looking up. Cut back to the wolf continuing right; it reaches a rocky drop and lowers its head over the edge.\nS12   02:14 – 02:23   |   Animals scatter\nBack at the fruit tree, the goat runs away. The round animal remains briefly, then jumps right as the wolf rushes in. Cuts alternate the fleeing round animal with the wolf crouched near the trunk.\nS13   02:23 – 02:37   |   Pursuit to the rocks\nThe wolf bounds right through the forest after the round animal. At a pile of stones, the round animal curls into a ball. The wolf arrives, rises on its hind legs and strikes/kicks the ball, sending it away.\nS14   02:37 – 02:45   |   Rolling down the slope\nThe ball-shaped animal rolls along sloping ground and hits a tree; stars appear around it. It opens back into its rounded animal form at the base of the trunk.\nS15   02:45 – 03:01   |   Wolf returns to the fruit tree\nThe wolf turns near the rocks, then runs back to the fruit-strewn tree, lowers its head to the ground and moves off left. The empty clearing fades to black.\nS16   03:01 – 03:08   |   Meeting intertitle\nVertical Japanese narration on black.\nOn screen: 其の夜、暴虐な狼に對する對抗策を協議する爲に村會が開かれました (card describing a village meeting about measures against the wolf).\nS17   03:08 – 03:30   |   Animals seated in a room\nA group sits in a circle under a hanging lamp, with sliding doors behind. Closer views pan across a dog, bearded/horned animals, and round animals, several resting heads on hands. The dark-eye-marked round animal raises its head, then stands.\nS18   03:30 – 03:42   |   Standing speaker\nA dialogue card interrupts the meeting. Back in the room, the round animal gestures, raises its arms and displays a small leaf-like object. A second card follows.\nOn screen: 03:30–03:34: あ、さうだ 好い考へがある あっしにお委せ下さい; 03:39–03:41: どうです こんな風にやって……\nS19   03:42 – 03:54   |   Transformation demonstration\nThe standing animal becomes a tall pale figure with an enlarged head, large eyes and long hanging tentacle-like strips below. The seated animals recoil. It returns to its round form, hands on hips, and is isolated by an iris.\nOn screen: 03:47–03:52 card includes これで狼の奴を威しておいて、きっと生捕にしてお目にかけます.\nS20   03:54 – 04:10   |   Next morning; travel\nDark frames and a short intertitle lead to the round animal walking in the forest with a cloth tied at its neck. A distant view shows it on a path through open hills.\nOn screen: 翌朝 (“next morning”).\nS21   04:10 – 04:30   |   Wolf above the mountain path\nThe wolf sits atop a high, cracked rock. Alternating views show the round animal walking below a rock wall and on a winding mountainside path. The wolf rises, jumps from its perch, and lands among large angular rocks.\nS22   04:30 – 04:47   |   Encounter among rocks\nThe round animal continues along the cliff base. The wolf is revealed beside a rock, followed by a close view of its eyes and grinning mouth. An iris shows the round animal raising an arm.\nOn screen: 04:45–04:47: やい狼！\nS23   04:47 – 04:59   |   Changing shapes\nAt the rock wall the round animal stretches into a taller pale quadruped-like animal standing upright. Cuts show the wolf advancing. The tall shape collapses back into the round animal, which bends to the ground.\nS24   04:59 – 05:13   |   Tall pale apparition and wolf\nThe round animal becomes the large-eyed, tentacle-skirted figure again. The wolf walks past it, turns, crouches and bares its teeth. The pale figure opens its mouth; the wolf leaps toward it.\nOn screen: 05:11–05:12: しまった！\nS25   05:13 – 05:32   |   Return to the waiting group\nThe round animal, back in its ordinary shape with neck cloth, walks away along the rocks and through the forest with its head lowered. A group including a rabbit, dog and round animals waits by a tree at the village edge. It approaches them.\nS26   05:32 – 05:48   |   Group exchange\nIris views isolate the dog gesturing and then the round animal bowing, clutching its cloth and gesturing with one hand. The wider group faces it. The scene fades out.\nS27   05:48 – 06:07   |   Season change\nA Japanese card dissolves over a broad mountain valley with a small cluster of buildings. A dissolve changes the dark, largely bare valley into a pale, snow-covered landscape; fade to dark.\nOn screen: 秋も過ぎて 冬がおとづれました (autumn passes and winter arrives).\nS28   06:07 – 06:23   |   Village yard and lookout\nIn front of a large building, rabbits hold hands in a ring while other animals form a curved line. A squirrel with a large upright bushy tail sits in a tree. It looks through a long telescope at the yard, lowers it, turns and looks toward the mountains.\nS29   06:23 – 06:37   |   Telescope view of snowy mountains\nA circular view pans across snow-covered peaks and slopes. A dotted trail crosses the snow. At the lower edge, the black wolf comes into view moving along the slope.\nS30   06:37 – 06:44   |   Squirrel gives warning\nThe squirrel leaves the branch, lands by the trunk and opens its mouth with radiating marks. A Japanese warning card appears; the squirrel is then shown calling again.\nOn screen: 狼が山を下りて來たぞーッ (“The wolf has come down the mountain!”).\nS31   06:44 – 06:55   |   Yard dispersal; wolf descends\nRabbits tumble and run from the yard; larger animals also hurry away past the building. Cut to the wolf walking right over snow at the foot of a wooded, rocky hillside, leaving dark pawprints.\nS32   06:55 – 07:01   |   Squirrel on house ladder\nThe bushy-tailed squirrel climbs a vertical wooden ladder fixed against a house wall. It stops on a projecting rung/platform beneath a small roofed fixture, lifting an arm toward it.\nS33   07:01 – 07:12   |   Animals hurry through the village\nA large round animal and a smaller one move past thatched houses; the larger one repeatedly lifts its head and opens its mouth. Other animals run into view. A brief cut returns to the squirrel on the ladder.\nS34   07:12 – 07:20   |   Interior fright and wolf entering village\nA pale animal by a square opening in a raised floor jumps up. A cloud fills the room and the animal springs outside. Another animal runs beside a house. The wolf appears in a gap between buildings and runs across.\nS35   07:20 – 07:30   |   Street transformations and barrel\nA rabbit briefly appears in a spinning, compressed form. A larger pale animal looks around and moves down the street. Beside long boards leaning against a house, it bends by an upright wooden barrel and climbs into/onto it.\nS36   07:30 – 07:41   |   Wolf advances; barrel tips\nThe wolf runs right between tree trunks. Back in the street, the round animal is perched in the barrel, its lower body dark. Three small animals approach and tumble; the barrel tips over, spilling the larger animal, now marked with a dark patch.\nS37   07:41 – 07:52   |   Rabbit and dark monkey figure\nA rabbit bounds over open ground, stops beside a house and bows forward. A dark, shadow-like monkey silhouette with a curled tail appears next to it. The figure rises and gestures; pale facial details become visible. Rabbit and monkey face each other, then move together.\nS38   07:52 – 08:03   |   Rabbit and monkey travel\nThe rabbit and dark monkey move side by side across a bare landscape, then run along a village street past thatched houses. Briefly, two small pale animals are seen together in the street before the pair passes.\nS39   08:03 – 08:16   |   At a house door\nThe rabbit and monkey stop outside a house beside a bare tree and fence. The rabbit bends and jumps against the closed door. A bearded, horned goat opens it; rabbit and monkey enter, and the door closes.\nS40   08:16 – 08:26   |   Indoor exchange and monkey close-up\nThe goat sits on a raised step at left, the rabbit stands centrally, and the dark monkey gestures at right. A round hanging object and bundles are on the wall. A circular close-up reveals the monkey’s pale muzzle, eyes and long curled tail against its dark body.\nS41   08:26 – 08:35   |   Monkey speaks\nA dialogue card alternates with the monkey standing hands on hips in an iris. In the room the goat stands, and all three gesture.\nOn screen: Japanese dialogue card includes 萬事お委せなさい (“Leave everything to me”).\nS42   08:35 – 08:44   |   Departure from house\nThe monkey walks out first and points ahead. Goat and rabbit follow to the doorway, raising their arms as the monkey continues right. Fade through black.\nS43   08:44 – 08:54   |   Monkeys among mountain rocks\nOne dark monkey runs left over angular boulders below a steep rock wall. More monkeys enter behind it and climb across the rocks in the same direction.\nS44   08:54 – 09:06   |   Wolf at a cliff edge\nThe wolf approaches a bare tree on a high rock ledge, then looks outward and down. A reverse wide view shows small pale animals watching from a distant cliff top. Back at the tree, the wolf rises and leans toward the drop.\nS45   09:06 – 09:15   |   Monkey climbs to the wolf\nThe view moves down the steep rock face to monkeys on lower ledges. One climbs up to the rim beside the tree. An iris shows it gripping the cliff edge and lifting a hand toward the wolf.\nS46   09:15 – 09:25   |   Cliffside dialogue\nA greeting card is followed by an iris close-up of the wolf baring its teeth. A second card precedes the monkey raising a hand while holding the rock.\nOn screen: こんにちは 狼の大将！; なんだ 猿公が 好いところへ來たな…… そこ動くな！\nS47   09:25 – 09:42   |   Dialogue across the ledge\nA longer vertical Japanese card interrupts the exchange. It mentions 山羊 and 川向へ; iris views then return to monkey and wolf. Another short card follows.\nOn screen: The long card begins 冗談ぢゃありませんよ and includes 貴方を山羊の居る川向へお渡し申さうと思ってやって來たのです. The next card reads さうか 宜しい すぐ案内せい.\nS48   09:42 – 09:49   |   Monkey reaches the tree ledge\nThe wolf waits upright beside the bare tree. The monkey pulls itself onto the ledge and points outward. Below, a row of monkeys gathers across the rocks and begins climbing.\nS49   09:49 – 10:05   |   Monkeys link up the trunk\nMonkeys climb the cliff and then the tree beside the wolf and lead monkey. They join one another in a long vertical chain against the trunk, with successive monkeys holding the next. An iris emphasizes their linked bodies.\nS50   10:05 – 10:13   |   Living bridge spans the chasm\nA wide view shows two sheer cliff edges separated by a deep open ravine. The long chain of monkeys extends from the tree on the left, swings downward and stretches across to the right rim, forming a sagging living bridge. The wolf and lead monkey remain at the left end.\nS51   10:13 – 10:20   |   Lead monkey crosses\nThe lead monkey points across, then steps onto the linked monkeys and runs from left to right over their backs. It bends down toward one of the monkeys near the middle. The wolf remains behind at the departure ledge.\nS52   10:20 – 10:28   |   Crossing completed\nA short Japanese card interrupts the crossing. The lead monkey continues right, steps up onto the far cliff, turns back and gestures toward the bridge.\nOn screen: しっかり頼むよ.\nS53   10:28 – 10:37   |   Wolf follows onto the bridge\nBack beside the tree, the wolf walks to the left end of the living bridge and steps out onto the linked bodies. A side view shows it progressing right on the monkeys, first upright and then bent low.\nS54   10:37 – 10:42   |   Wolf crouched above the drop\nA downward insert shows scattered angular rocks far below. Back on the bridge the wolf crouches and grips downward; concentric rings appear around its body while it remains near the middle of the span.\nS55   10:42 – 10:45   |   Signal from the far side\nThe lead monkey stands on the right cliff above the bridge end. It turns toward the span and raises both arms high. Cut to the wolf still crouched on the monkeys.\nS56   10:45 – 10:48   |   Bridge opens; wolf falls\nIn a wide view the linked bridge separates beneath the wolf. The two chains hang from opposite sides, leaving an opening in the middle. The wolf drops between them into the ravine and passes out of view below.\nS57   10:48 – 10:53   |   Animals at the rim\nPale animals, including long-eared rabbits, crowd along a high rocky rim and wave their raised arms. The image fades through black.\nS58   10:53 – 11:03   |   Closing narration\nVertical Japanese lettering on black fades down.\nOn screen: それから 山の麓の村には再び幸福な日が返ってまいりました (closing narration about happy days returning to the village at the mountain’s foot).\nS59   11:03 – 11:11   |   End title and black\nThe Japanese title returns above a large end character, then fades to black.\nOn screen: 狼は狼だ (right-to-left setting); 終.\nS60   11:11 – 11:16.224   |   Access credit\nBilingual white text on black fills the closing frames.\nOn screen: English credit states that the film was made available online through the National Project for the Sustainability of Born-Digital Cinema, supported by Japan’s Agency for Cultural Affairs in fiscal 2016; dated January 2017, National Film Center, The Museum of Modern Art, Tokyo.","segments":[{"id":"S01","heading":"S01   00:00 – 00:05   |   Opening identification","start":"00:00","end":"00:05","text":["White bilingual lettering on black.","On screen: “漫画 狼は狼だ”; “A Wolf is a Wolf”; “(1931, Yasuji Murata, 11 min)”."]},{"id":"S02","heading":"S02   00:05 – 00:12   |   Production card","start":"00:05","end":"00:12","text":["A bordered Japanese credit card fades up and down; an NFC mark appears at lower right.","On screen: Right-to-left horizontal production lettering: 文部省製作."]},{"id":"S03","heading":"S03   00:12 – 00:22   |   Illustrated title and credit","start":"00:12","end":"00:22","text":["A large black wolf stands over small animal silhouettes, including monkeys. The title fades to a Japanese animation credit and then dark frames.","On screen: Title: 狼は狼だ (set right to left); animation credit names 村田安司."]},{"id":"S04","heading":"S04   00:22 – 00:29   |   Village establishing view","start":"00:22","end":"00:29","text":["Thatched rooftops, fence, bare branches and a tree bearing round fruit. Dissolve to a road outside a house with an open shuttered window and hedge."]},{"id":"S05","heading":"S05   00:29 – 00:45   |   Two animals outside the house","start":"00:29","end":"00:45","text":["A thin, horned, bearded goat faces a round, dark-eye-marked, long-tailed animal (raccoon dog). They gesture; the round animal raises both arms. The goat walks left and the round animal follows."]},{"id":"S06","heading":"S06   00:45 – 01:10   |   Forest walk and fright","start":"00:45","end":"01:10","text":["The goat leads among tall bare trunks. Behind it the round animal leaps and briefly becomes a dark, upright, toothy figure. The goat falls backward with stars around its head, gets up and gestures. The round animal returns to its pale, rounded shape. An iris isolates it."]},{"id":"S07","heading":"S07   01:10 – 01:15   |   Forest dialogue card","start":"01:10","end":"01:15","text":["Vertical Japanese lettering on black, followed by an iris returning to the round animal.","On screen: もう威かさないから 勘辨しておくれよ……"]},{"id":"S08","heading":"S08   01:15 – 01:34   |   Walking toward the fruit tree","start":"01:15","end":"01:34","text":["The goat rejoins the round animal. They gesture and walk left. A cutaway shows many round fruits on bare branches, then dissolves to the two animals on either side of the trunk."]},{"id":"S09","heading":"S09   01:34 – 01:47   |   Falling fruit","start":"01:34","end":"01:47","text":["The round animal moves against the tree. Fruit drops and piles around both animals. They sit near the trunk and lift fruit toward their mouths; more fruit falls."]},{"id":"S10","heading":"S10   01:47 – 02:00   |   Wolf in the woods","start":"01:47","end":"02:00","text":["A black wolf with pointed ears, long muzzle, visible teeth and bushy tail walks right on four legs. Tracking views carry it behind and between tree trunks."]},{"id":"S11","heading":"S11   02:00 – 02:14   |   Fruit eaters and approaching wolf","start":"02:00","end":"02:14","text":["The goat and round animal sit amid fallen fruit, eating and looking up. Cut back to the wolf continuing right; it reaches a rocky drop and lowers its head over the edge."]},{"id":"S12","heading":"S12   02:14 – 02:23   |   Animals scatter","start":"02:14","end":"02:23","text":["Back at the fruit tree, the goat runs away. The round animal remains briefly, then jumps right as the wolf rushes in. Cuts alternate the fleeing round animal with the wolf crouched near the trunk."]},{"id":"S13","heading":"S13   02:23 – 02:37   |   Pursuit to the rocks","start":"02:23","end":"02:37","text":["The wolf bounds right through the forest after the round animal. At a pile of stones, the round animal curls into a ball. The wolf arrives, rises on its hind legs and strikes/kicks the ball, sending it away."]},{"id":"S14","heading":"S14   02:37 – 02:45   |   Rolling down the slope","start":"02:37","end":"02:45","text":["The ball-shaped animal rolls along sloping ground and hits a tree; stars appear around it. It opens back into its rounded animal form at the base of the trunk."]},{"id":"S15","heading":"S15   02:45 – 03:01   |   Wolf returns to the fruit tree","start":"02:45","end":"03:01","text":["The wolf turns near the rocks, then runs back to the fruit-strewn tree, lowers its head to the ground and moves off left. The empty clearing fades to black."]},{"id":"S16","heading":"S16   03:01 – 03:08   |   Meeting intertitle","start":"03:01","end":"03:08","text":["Vertical Japanese narration on black.","On screen: 其の夜、暴虐な狼に對する對抗策を協議する爲に村會が開かれました (card describing a village meeting about measures against the wolf)."]},{"id":"S17","heading":"S17   03:08 – 03:30   |   Animals seated in a room","start":"03:08","end":"03:30","text":["A group sits in a circle under a hanging lamp, with sliding doors behind. Closer views pan across a dog, bearded/horned animals, and round animals, several resting heads on hands. The dark-eye-marked round animal raises its head, then stands."]},{"id":"S18","heading":"S18   03:30 – 03:42   |   Standing speaker","start":"03:30","end":"03:42","text":["A dialogue card interrupts the meeting. Back in the room, the round animal gestures, raises its arms and displays a small leaf-like object. A second card follows.","On screen: 03:30–03:34: あ、さうだ 好い考へがある あっしにお委せ下さい; 03:39–03:41: どうです こんな風にやって……"]},{"id":"S19","heading":"S19   03:42 – 03:54   |   Transformation demonstration","start":"03:42","end":"03:54","text":["The standing animal becomes a tall pale figure with an enlarged head, large eyes and long hanging tentacle-like strips below. The seated animals recoil. It returns to its round form, hands on hips, and is isolated by an iris.","On screen: 03:47–03:52 card includes これで狼の奴を威しておいて、きっと生捕にしてお目にかけます."]},{"id":"S20","heading":"S20   03:54 – 04:10   |   Next morning; travel","start":"03:54","end":"04:10","text":["Dark frames and a short intertitle lead to the round animal walking in the forest with a cloth tied at its neck. A distant view shows it on a path through open hills.","On screen: 翌朝 (“next morning”)."]},{"id":"S21","heading":"S21   04:10 – 04:30   |   Wolf above the mountain path","start":"04:10","end":"04:30","text":["The wolf sits atop a high, cracked rock. Alternating views show the round animal walking below a rock wall and on a winding mountainside path. The wolf rises, jumps from its perch, and lands among large angular rocks."]},{"id":"S22","heading":"S22   04:30 – 04:47   |   Encounter among rocks","start":"04:30","end":"04:47","text":["The round animal continues along the cliff base. The wolf is revealed beside a rock, followed by a close view of its eyes and grinning mouth. An iris shows the round animal raising an arm.","On screen: 04:45–04:47: やい狼！"]},{"id":"S23","heading":"S23   04:47 – 04:59   |   Changing shapes","start":"04:47","end":"04:59","text":["At the rock wall the round animal stretches into a taller pale quadruped-like animal standing upright. Cuts show the wolf advancing. The tall shape collapses back into the round animal, which bends to the ground."]},{"id":"S24","heading":"S24   04:59 – 05:13   |   Tall pale apparition and wolf","start":"04:59","end":"05:13","text":["The round animal becomes the large-eyed, tentacle-skirted figure again. The wolf walks past it, turns, crouches and bares its teeth. The pale figure opens its mouth; the wolf leaps toward it.","On screen: 05:11–05:12: しまった！"]},{"id":"S25","heading":"S25   05:13 – 05:32   |   Return to the waiting group","start":"05:13","end":"05:32","text":["The round animal, back in its ordinary shape with neck cloth, walks away along the rocks and through the forest with its head lowered. A group including a rabbit, dog and round animals waits by a tree at the village edge. It approaches them."]},{"id":"S26","heading":"S26   05:32 – 05:48   |   Group exchange","start":"05:32","end":"05:48","text":["Iris views isolate the dog gesturing and then the round animal bowing, clutching its cloth and gesturing with one hand. The wider group faces it. The scene fades out."]},{"id":"S27","heading":"S27   05:48 – 06:07   |   Season change","start":"05:48","end":"06:07","text":["A Japanese card dissolves over a broad mountain valley with a small cluster of buildings. A dissolve changes the dark, largely bare valley into a pale, snow-covered landscape; fade to dark.","On screen: 秋も過ぎて 冬がおとづれました (autumn passes and winter arrives)."]},{"id":"S28","heading":"S28   06:07 – 06:23   |   Village yard and lookout","start":"06:07","end":"06:23","text":["In front of a large building, rabbits hold hands in a ring while other animals form a curved line. A squirrel with a large upright bushy tail sits in a tree. It looks through a long telescope at the yard, lowers it, turns and looks toward the mountains."]},{"id":"S29","heading":"S29   06:23 – 06:37   |   Telescope view of snowy mountains","start":"06:23","end":"06:37","text":["A circular view pans across snow-covered peaks and slopes. A dotted trail crosses the snow. At the lower edge, the black wolf comes into view moving along the slope."]},{"id":"S30","heading":"S30   06:37 – 06:44   |   Squirrel gives warning","start":"06:37","end":"06:44","text":["The squirrel leaves the branch, lands by the trunk and opens its mouth with radiating marks. A Japanese warning card appears; the squirrel is then shown calling again.","On screen: 狼が山を下りて來たぞーッ (“The wolf has come down the mountain!”)."]},{"id":"S31","heading":"S31   06:44 – 06:55   |   Yard dispersal; wolf descends","start":"06:44","end":"06:55","text":["Rabbits tumble and run from the yard; larger animals also hurry away past the building. Cut to the wolf walking right over snow at the foot of a wooded, rocky hillside, leaving dark pawprints."]},{"id":"S32","heading":"S32   06:55 – 07:01   |   Squirrel on house ladder","start":"06:55","end":"07:01","text":["The bushy-tailed squirrel climbs a vertical wooden ladder fixed against a house wall. It stops on a projecting rung/platform beneath a small roofed fixture, lifting an arm toward it."]},{"id":"S33","heading":"S33   07:01 – 07:12   |   Animals hurry through the village","start":"07:01","end":"07:12","text":["A large round animal and a smaller one move past thatched houses; the larger one repeatedly lifts its head and opens its mouth. Other animals run into view. A brief cut returns to the squirrel on the ladder."]},{"id":"S34","heading":"S34   07:12 – 07:20   |   Interior fright and wolf entering village","start":"07:12","end":"07:20","text":["A pale animal by a square opening in a raised floor jumps up. A cloud fills the room and the animal springs outside. Another animal runs beside a house. The wolf appears in a gap between buildings and runs across."]},{"id":"S35","heading":"S35   07:20 – 07:30   |   Street transformations and barrel","start":"07:20","end":"07:30","text":["A rabbit briefly appears in a spinning, compressed form. A larger pale animal looks around and moves down the street. Beside long boards leaning against a house, it bends by an upright wooden barrel and climbs into/onto it."]},{"id":"S36","heading":"S36   07:30 – 07:41   |   Wolf advances; barrel tips","start":"07:30","end":"07:41","text":["The wolf runs right between tree trunks. Back in the street, the round animal is perched in the barrel, its lower body dark. Three small animals approach and tumble; the barrel tips over, spilling the larger animal, now marked with a dark patch."]},{"id":"S37","heading":"S37   07:41 – 07:52   |   Rabbit and dark monkey figure","start":"07:41","end":"07:52","text":["A rabbit bounds over open ground, stops beside a house and bows forward. A dark, shadow-like monkey silhouette with a curled tail appears next to it. The figure rises and gestures; pale facial details become visible. Rabbit and monkey face each other, then move together."]},{"id":"S38","heading":"S38   07:52 – 08:03   |   Rabbit and monkey travel","start":"07:52","end":"08:03","text":["The rabbit and dark monkey move side by side across a bare landscape, then run along a village street past thatched houses. Briefly, two small pale animals are seen together in the street before the pair passes."]},{"id":"S39","heading":"S39   08:03 – 08:16   |   At a house door","start":"08:03","end":"08:16","text":["The rabbit and monkey stop outside a house beside a bare tree and fence. The rabbit bends and jumps against the closed door. A bearded, horned goat opens it; rabbit and monkey enter, and the door closes."]},{"id":"S40","heading":"S40   08:16 – 08:26   |   Indoor exchange and monkey close-up","start":"08:16","end":"08:26","text":["The goat sits on a raised step at left, the rabbit stands centrally, and the dark monkey gestures at right. A round hanging object and bundles are on the wall. A circular close-up reveals the monkey’s pale muzzle, eyes and long curled tail against its dark body."]},{"id":"S41","heading":"S41   08:26 – 08:35   |   Monkey speaks","start":"08:26","end":"08:35","text":["A dialogue card alternates with the monkey standing hands on hips in an iris. In the room the goat stands, and all three gesture.","On screen: Japanese dialogue card includes 萬事お委せなさい (“Leave everything to me”)."]},{"id":"S42","heading":"S42   08:35 – 08:44   |   Departure from house","start":"08:35","end":"08:44","text":["The monkey walks out first and points ahead. Goat and rabbit follow to the doorway, raising their arms as the monkey continues right. Fade through black."]},{"id":"S43","heading":"S43   08:44 – 08:54   |   Monkeys among mountain rocks","start":"08:44","end":"08:54","text":["One dark monkey runs left over angular boulders below a steep rock wall. More monkeys enter behind it and climb across the rocks in the same direction."]},{"id":"S44","heading":"S44   08:54 – 09:06   |   Wolf at a cliff edge","start":"08:54","end":"09:06","text":["The wolf approaches a bare tree on a high rock ledge, then looks outward and down. A reverse wide view shows small pale animals watching from a distant cliff top. Back at the tree, the wolf rises and leans toward the drop."]},{"id":"S45","heading":"S45   09:06 – 09:15   |   Monkey climbs to the wolf","start":"09:06","end":"09:15","text":["The view moves down the steep rock face to monkeys on lower ledges. One climbs up to the rim beside the tree. An iris shows it gripping the cliff edge and lifting a hand toward the wolf."]},{"id":"S46","heading":"S46   09:15 – 09:25   |   Cliffside dialogue","start":"09:15","end":"09:25","text":["A greeting card is followed by an iris close-up of the wolf baring its teeth. A second card precedes the monkey raising a hand while holding the rock.","On screen: こんにちは 狼の大将！; なんだ 猿公が 好いところへ來たな…… そこ動くな！"]},{"id":"S47","heading":"S47   09:25 – 09:42   |   Dialogue across the ledge","start":"09:25","end":"09:42","text":["A longer vertical Japanese card interrupts the exchange. It mentions 山羊 and 川向へ; iris views then return to monkey and wolf. Another short card follows.","On screen: The long card begins 冗談ぢゃありませんよ and includes 貴方を山羊の居る川向へお渡し申さうと思ってやって來たのです. The next card reads さうか 宜しい すぐ案内せい."]},{"id":"S48","heading":"S48   09:42 – 09:49   |   Monkey reaches the tree ledge","start":"09:42","end":"09:49","text":["The wolf waits upright beside the bare tree. The monkey pulls itself onto the ledge and points outward. Below, a row of monkeys gathers across the rocks and begins climbing."]},{"id":"S49","heading":"S49   09:49 – 10:05   |   Monkeys link up the trunk","start":"09:49","end":"10:05","text":["Monkeys climb the cliff and then the tree beside the wolf and lead monkey. They join one another in a long vertical chain against the trunk, with successive monkeys holding the next. An iris emphasizes their linked bodies."]},{"id":"S50","heading":"S50   10:05 – 10:13   |   Living bridge spans the chasm","start":"10:05","end":"10:13","text":["A wide view shows two sheer cliff edges separated by a deep open ravine. The long chain of monkeys extends from the tree on the left, swings downward and stretches across to the right rim, forming a sagging living bridge. The wolf and lead monkey remain at the left end."]},{"id":"S51","heading":"S51   10:13 – 10:20   |   Lead monkey crosses","start":"10:13","end":"10:20","text":["The lead monkey points across, then steps onto the linked monkeys and runs from left to right over their backs. It bends down toward one of the monkeys near the middle. The wolf remains behind at the departure ledge."]},{"id":"S52","heading":"S52   10:20 – 10:28   |   Crossing completed","start":"10:20","end":"10:28","text":["A short Japanese card interrupts the crossing. The lead monkey continues right, steps up onto the far cliff, turns back and gestures toward the bridge.","On screen: しっかり頼むよ."]},{"id":"S53","heading":"S53   10:28 – 10:37   |   Wolf follows onto the bridge","start":"10:28","end":"10:37","text":["Back beside the tree, the wolf walks to the left end of the living bridge and steps out onto the linked bodies. A side view shows it progressing right on the monkeys, first upright and then bent low."]},{"id":"S54","heading":"S54   10:37 – 10:42   |   Wolf crouched above the drop","start":"10:37","end":"10:42","text":["A downward insert shows scattered angular rocks far below. Back on the bridge the wolf crouches and grips downward; concentric rings appear around its body while it remains near the middle of the span."]},{"id":"S55","heading":"S55   10:42 – 10:45   |   Signal from the far side","start":"10:42","end":"10:45","text":["The lead monkey stands on the right cliff above the bridge end. It turns toward the span and raises both arms high. Cut to the wolf still crouched on the monkeys."]},{"id":"S56","heading":"S56   10:45 – 10:48   |   Bridge opens; wolf falls","start":"10:45","end":"10:48","text":["In a wide view the linked bridge separates beneath the wolf. The two chains hang from opposite sides, leaving an opening in the middle. The wolf drops between them into the ravine and passes out of view below."]},{"id":"S57","heading":"S57   10:48 – 10:53   |   Animals at the rim","start":"10:48","end":"10:53","text":["Pale animals, including long-eared rabbits, crowd along a high rocky rim and wave their raised arms. The image fades through black."]},{"id":"S58","heading":"S58   10:53 – 11:03   |   Closing narration","start":"10:53","end":"11:03","text":["Vertical Japanese lettering on black fades down.","On screen: それから 山の麓の村には再び幸福な日が返ってまいりました (closing narration about happy days returning to the village at the mountain’s foot)."]},{"id":"S59","heading":"S59   11:03 – 11:11   |   End title and black","start":"11:03","end":"11:11","text":["The Japanese title returns above a large end character, then fades to black.","On screen: 狼は狼だ (right-to-left setting); 終."]},{"id":"S60","heading":"S60   11:11 – 11:16.224   |   Access credit","start":"11:11","end":"11:16","text":["Bilingual white text on black fills the closing frames.","On screen: English credit states that the film was made available online through the National Project for the Sustainability of Born-Digital Cinema, supported by Japan’s Agency for Cultural Affairs in fiscal 2016; dated January 2017, National Film Center, The Museum of Modern Art, Tokyo."]}],"question_text":"QA Set for the Uploaded Video\nA Wolf is a Wolf (1931)\nQ1. Which animal is the main antagonist throughout the film?\nA. A fox\nB. A wolf\nC. A bear\nD. A tiger\nQ2. Which animal appears later as the clever helper who leads the final counterplan?   \nA. A monkey\nB. A deer\nC. A bird\nD. A dog\nQ3. During the village warning sequence, which animal is shown climbing a ladder attached to a house? \nA. A rabbit\nB. A monkey\nC. A squirrel\nD. A raccoon dog\nQ4. What visual form introduces the monkey before the final plan is fully carried out?   \nA. A reflection in water\nB. A shadow silhouette\nC. A painting on a wall\nD. A mask on the ground\nQ5. Before the climax at the ravine, where is the wolf repeatedly shown moving?   \nA. Across snowy or rocky mountain terrain\nB. Inside a city street\nC. On a boat at sea\nD. In a factory\nQ6. What obstacle separates the sides in the final showdown?\nA. A river\nB. A wall of fire\nC. A deep ravine or chasm\nD. A locked gate\nQ7. What do the monkeys create so someone can cross the gap? \nA. A wooden bridge\nB. A rope ladder\nC. A chain of monkeys forming a living bridge\nD. A stone staircase\nQ8. Who crosses the living bridge first?\nA. The wolf\nB. A rabbit\nC. The monkey\nD. The squirrel\nQ9. What does the wolf do immediately after seeing the crossing method work? \nA. It runs back to the village\nB. It steps onto the living bridge and follows\nC. It hides behind a rock\nD. It starts digging under the cliff\nQ10. What is the final outcome for the wolf at the end of the bridge sequence?\nA. It safely reaches the far side\nB. It becomes trapped in a house\nC. It is tied to a tree\nD. It falls into the ravine","questions":{"Q1":"Q1. Which animal is the main antagonist throughout the film?\nA. A fox\nB. A wolf\nC. A bear\nD. A tiger","Q2":"Q2. Which animal appears later as the clever helper who leads the final counterplan?   \nA. A monkey\nB. A deer\nC. A bird\nD. A dog","Q3":"Q3. During the village warning sequence, which animal is shown climbing a ladder attached to a house? \nA. A rabbit\nB. A monkey\nC. A squirrel\nD. A raccoon dog","Q4":"Q4. What visual form introduces the monkey before the final plan is fully carried out?   \nA. A reflection in water\nB. A shadow silhouette\nC. A painting on a wall\nD. A mask on the ground","Q5":"Q5. Before the climax at the ravine, where is the wolf repeatedly shown moving?   \nA. Across snowy or rocky mountain terrain\nB. Inside a city street\nC. On a boat at sea\nD. In a factory","Q6":"Q6. What obstacle separates the sides in the final showdown?\nA. A river\nB. A wall of fire\nC. A deep ravine or chasm\nD. A locked gate","Q7":"Q7. What do the monkeys create so someone can cross the gap? \nA. A wooden bridge\nB. A rope ladder\nC. A chain of monkeys formi The goat falls backward with stars around its head, gets up and gestures. The round animal returns to its pale, rounded shape. An iris isolates it.\nS07   01:10 – 01:15   |   Forest dialogue card\nVertical Japanese lettering on black, followed by an iris returning to the round animal.\nOn screen: もう威かさないから 勘辨しておくれよ……\nS08   01:15 – 01:34   |   Walking toward the fruit tree\nThe goat rejoins the round animal. They gesture and walk left. A cutaway shows many round fruits on bare branches, then dissolves to the two animals on either side of the trunk.\nS09   01:34 – 01:47   |   Falling fruit\nThe round animal moves against the tree. Fruit drops and piles around both animals. They sit near the trunk and lift fruit toward their mouths; more fruit falls.\nS10   01:47 – 02:00   |   Wolf in the woods\nA black wolf with pointed ears, long muzzle, visible teeth and bushy tail walks right on four legs. Tracking views carry it behind and between tree trunks.\nS11   02:00 – 02:14   |   Fruit eaters and approaching wolf\nThe goat and round animal sit amid fallen fruit, eating and looking up. Cut back to the wolf continuing right; it reaches a rocky drop and lowers its head over the edge.\nS12   02:14 – 02:23   |   Animals scatter\nBack at the fruit tree, the goat runs away. The round animal remains briefly, then jumps right as the wolf rushes in. Cuts alternate the fleeing round animal with the wolf crouched near the trunk.\nS13   02:23 – 02:37   |   Pursuit to the rocks\nThe wolf bounds right through the forest after the round animal. At a pile of stones, the round animal curls into a ball. The wolf arrives, rises on its hind legs and strikes/kicks the ball, sending it away.\nS14   02:37 – 02:45   |   Rolling down the slope\nThe ball-shaped animal rolls along sloping ground and hits a tree; stars appear around it. It opens back into its rounded animal form at the base of the trunk.\nS15   02:45 – 03:01   |   Wolf returns to the fruit tree\nThe wolf turns near the rocks, then runs back to the fruit-strewn tree, lowers its head to the ground and moves off left. The empty clearing fades to black.\nS16   03:01 – 03:08   |   Meeting intertitle\nVertical Japanese narration on black.\nOn screen: 其の夜、暴虐な狼に對する對抗策を協議する爲に村會が開かれました (card describing a village meeting about measures against the wolf).\nS17   03:08 – 03:30   |   Animals seated in a room\nA group sits in a circle under a hanging lamp, with sliding doors behind. Closer views pan across a dog, bearded/horned animals, and round animals, several resting heads on hands. The dark-eye-marked round animal raises its head, then stands.\nS18   03:30 – 03:42   |   Standing speaker\nA dialogue card interrupts the meeting. Back in the room, the round animal gestures, raises its arms and displays a small leaf-like object. A second card follows.\nOn screen: 03:30–03:34: あ、さうだ 好い考へがある あっしにお委せ下さい; 03:39–03:41: どうです こんな風にやって……\nS19   03:42 – 03:54   |   Transformation demonstration\nThe standing animal becomes a tall pale figure with an enlarged head, large eyes and long hanging tentacle-like strips below. The seated animals recoil. It returns to its round form, hands on hips, and is isolated by an iris.\nOn screen: 03:47–03:52 card includes これで狼の奴を威しておいて、きっと生捕にしてお目にかけます.\nS20   03:54 – 04:10   |   Next morning; travel\nDark frames and a short intertitle lead to the round animal walking in the forest with a cloth tied at its neck. A distant view shows it on a path through open hills.\nOn screen: 翌朝 (“next morning”).\nS21   04:10 – 04:30   |   Wolf above the mountain path\nThe wolf sits atop a high, cracked rock. Alternating views show the round animal walking below a rock wall and on a winding mountainside path. The wolf rises, jumps from its perch, and lands among large angular rocks.\nS22   04:30 – 04:47   |   Encounter among rocks\nThe round animal continues along the cliff base. The wolf is revealed beside a rock, followed by a close view of its eyes and grinning mouth. An iris shows the round animal raising an arm.\nOn screen: 04:45–04:47: やい狼！\nS23   04:47 – 04:59   |   Changing shapes\nAt the rock wall the round animal stretches into a taller pale quadruped-like animal standing upright. Cuts show the wolf advancing. The tall shape collapses back into the round animal, which bends to the ground.\nS24   04:59 – 05:13   |   Tall pale apparition and wolf\nThe round animal becomes the large-eyed, tentacle-skirted figure again. The wolf walks past it, turns, crouches and bares its teeth. The pale figure opens its mouth; the wolf leaps toward it.\nOn screen: 05:11–05:12: しまった！\nS25   05:13 – 05:32   |   Return to the waiting group\nThe round animal, back in its ordinary shape with neck cloth, walks away along the rocks and through the forest with its head lowered. A group including a rabbit, dog and round animals waits by a tree at the village edge. It approaches them.\nS26   05:32 – 05:48   |   Group exchange\nIris views isolate the dog gesturing and then the round animal bowing, clutching its cloth and gesturing with one hand. The wider group faces it. The scene fades out.\nS27   05:48 – 06:07   |   Season change\nA Japanese card dissolves over a broad mountain valley with a small cluster of buildings. A dissolve changes the dark, largely bare valley into a pale, snow-covered landscape; fade to dark.\nOn screen: 秋も過ぎて 冬がおとづれました (autumn passes and winter arrives).\nS28   06:07 – 06:23   |   Village yard and lookout\nIn front of a large building, rabbits hold hands in a ring while other animals form a curved line. A squirrel with a large upright bushy tail sits in a tree. It looks through a long telescope at the yard, lowers it, turns and looks toward the mountains.\nS29   06:23 – 06:37   |   Telescope view of snowy mountains\nA circular view pans across snow-covered peaks and slopes. A dotted trail crosses the snow. At the lower edge, the black wolf comes into view moving along the slope.\nS30   06:37 – 06:44   |   Squirrel gives warning\nThe squirrel leaves the branch, lands by the trunk and opens its mouth with radiating marks. A Japanese warning card appears; the squirrel is then shown calling again.\nOn screen: 狼が山を下りて來たぞーッ (“The wolf has come down the mountain!”).\nS31   06:44 – 06:55   |   Yard dispersal; wolf descends\nRabbits tumble and run from the yard; larger animals also hurry away past the building. Cut to the wolf walking right over snow at the foot of a wooded, rocky hillside, leaving dark pawprints.\nS32   06:55 – 07:01   |   Squirrel on house ladder\nThe bushy-tailed squirrel climbs a vertical wooden ladder fixed against a house wall. It stops on a projecting rung/platform beneath a small roofed fixture, lifting an arm toward it.\nS33   07:01 – 07:12   |   Animals hurry through the village\nA large round animal and a smaller one move past thatched houses; the larger one repeatedly lifts its head and opens its mouth. Other animals run into view. A brief cut returns to the squirrel on the ladder.\nS34   07:12 – 07:20   |   Interior fright and wolf entering village\nA pale animal by a square opening in a raised floor jumps up. A cloud fills the room and the animal springs outside. Another animal runs beside a house. The wolf appears in a gap between buildings and runs across.\nS35   07:20 – 07:30   |   Street transformations and barrel\nA rabbit briefly appears in a spinning, compressed form. A larger pale animal looks around and moves down the street. Beside long boards leaning against a house, it bends by an upright wooden barrel and climbs into/onto it.\nS36   07:30 – 07:41   |   Wolf advances; barrel tips\nThe wolf runs right between tree trunks. Back in the street, the round animal is perched in the barrel, its lower body dark. Three small animals approach and tumble; the barrel tips over, spilling the larger animal, now marked with a dark patch.\nS37   07:41 – 07:52   |   Rabbit and dark monkey figure\nA rabbit bounds over open ground, stops beside a house and bows forward. A dark, shadow-like monkey silhouette with a curled tail appears next to it. The figure rises and gestures; pale facial details become visible. Rabbit and monkey face each other, then move together.\nS38   07:52 – 08:03   |   Rabbit and monkey travel\nThe rabbit and dark monkey move side by side across a bare landscape, then run along a village street past thatched houses. Briefly, two small pale animals are seen together in the street before the pair passes.\nS39   08:03 – 08:16   |   At a house door\nThe rabbit and monkey stop outside a house beside a bare tree and fence. The rabbit bends and jumps against the closed door. A bearded, horned goat opens it; rabbit and monkey enter, and the door closes.\nS40   08:16 – 08:26   |   Indoor exchange and monkey close-up\nThe goat sits on a raised step at left, the rabbit stands centrally, and the dark monkey gestures at right. A round hanging object and bundles are on the wall. A circular close-up reveals the monkey’s pale muzzle, eyes and long curled tail against its dark body.\nS41   08:26 – 08:35   |   Monkey speaks\nA dialogue card alternates with the monkey standing hands on hips in an iris. In the room the goat stands, and all three gesture.\nOn screen: Japanese dialogue card includes 萬事お委せなさい (“Leave everything to me”).\nS42   08:35 – 08:44   |   Departure from house\nThe monkey walks out first and points ahead. Goat and rabbit follow to the doorway, raising their arms as the monkey continues right. Fade through black.\nS43   08:44 – 08:54   |   Monkeys among mountain rocks\nOne dark monkey runs left over angular boulders below a steep rock wall. More monkeys enter behind it and climb across the rocks in the same direction.\nS44   08:54 – 09:06   |   Wolf at a cliff edge\nThe wolf approaches a bare tree on a high rock ledge, then looks outward and down. A reverse wide view shows small pale animals watching from a distant cliff top. Back at the tree, the wolf rises and leans toward the drop.\nS45   09:06 – 09:15   |   Monkey climbs to the wolf\nThe function renderTraceList(){const c=current(),h=state.invalid?c.invalid:c.history,q=state.traceQuery.toLowerCase();const es=h.items.filter(i=>(state.traceType==='all'||i.type===state.traceType)&&pretty(i).toLowerCase().includes(q));$('#traceCount').textContent=es.length+' / '+h.items.length+' 条公开动作 · 北京时间';$('#traceList').innerHTML=es.map(i=>{const type=i.type;let title=typeNames[type]||type,body='';if(type==='agentMessage'){title=i.phase==='final'?'最终提交说明':'模型公开进度说明';body=`<div class="message-text">${e(i.text)}</div>`}else if(type==='commandExecution'){const acts=i.commandActions||[];const cmd=acts.map(a=>a.command).filter(Boolean).join('\n')||i.command;title=(cmd.split('\n').find(x=>x.trim())||'本地命令').slice(0,140);body=`<h3>执行命令</h3>${pre(cmd)}<h3>完整命令行</h3>${pre(i.command)}<h3>工具输出</h3>${pre(i.aggregatedOutput||'（无输出）')}<div class="small muted">cwd: ${e(i.cwd)} · exit: ${e(i.exitCode)} · ${((i.durationMs||0)/1000).toFixed(2)}s</div>`}else if(type==='imageView'){title=i.path.split(/[\\/]/).pop();body=`<p class="small muted">${e(i.path)}</p>${i.asset?`<img loading="lazy" class="event-image" data-zoom="${A(i.asset)}" src="${A(i.asset)}" alt="模型实际查看：${e(title)}">`:pre(i.path)}<p class="caption">此图来自本题工作目录。点击可放大。</p>`}else if(type==='fileChange'){title=i.changes.map(x=>x.path.split(/[\\/]/).pop()).join(', ');body=i.changes.map(x=>`<h3>${e(x.path)}</h3>${pre(x.diff)}`).join('')}else{title=i.tool||type;body=pre(pretty(i))}const fail=type==='commandExecution'&&i.exitCode!==0;return `<details class="event ${type==='imageView'?'image':type==='agentMessage'?'message':''}" ${state.expand?'open':''}><summary><span class="event-time">${local(i.start)}</span><span class="event-kind">${typeNames[type]||type}</span><span class="event-label"><b>${e(title)}</b><small>${i.end?'完成 '+local(i.end):''}${type==='commandExecution'?' · '+((i.durationMs||0)/1000).toFixed(2)+' 秒':''}</small></span>${type==='commandExecution'?`<span class="exit ${fail?'fail':''}">${fail?'exit '+i.exitCode:'成功'}</span>`:''}</summary><div class="event-body">${body}</div></details>`}).join('')||'<div class="empty">没有匹配的动作。</div>'}
function gradeView(c){const g=c.grade;if(c.segments)return `<article class="panel"><div class="kicker">OFFICIAL QUESTION MATCHING / NEW JUDGE</div><div class="result-hero"><div class="score-big">1.0000</div><div><h2>10 / 10 个事实问题匹配</h2><p>GPT‑6.1 Sol / high 仅根据最终镜头日志回答 QC 问题，随后使用官方答案匹配与归一化公式计分。</p><span class="tag green">已完成一次评审</span></div></div><div class="notice warn" style="margin-bottom:0">这个满分衡量的是 <strong>10 个指定事实是否能从日志中恢复</strong>，并不等于所有段落、时间码与字幕都已被独立人工验证。原版 GPT‑5.4 judge 按你的要求替换为 6.1 Sol，因而不是相同 judge 条件的对照实验。</div></article><div class="grid"><article class="panel"><h2>逐题答案与答卷证据</h2><p class="section-note">点击展开原问题、judge 选择、标准选项和引用。证据定位会跳转到解题结果。</p>${Object.entries(g.details.answers).map(([qid,answer])=>{const question=c.questions[qid]||qid,quote=g.details.raw_judge_payload.evidence[qid];return `<details class="grade-row"><summary><span class="q-id">${qid}</span><span class="q-title">${e(question.split('\n')[0].replace(/^Q\d+\.\s*/,''))}</span><span class="match">${answer} ✓</span></summary><div class="grade-body">${pre(question,'original')}<div class="stats-inline"><span>judge 选择 ${answer}</span><span>标准选项 ${c.gold[qid]}</span><span>计分 1 / 1</span></div><div class="quote">${e(quote)}</div><button class="btn" data-evidence="${e(quote)}">定位到答卷证据 →</button></div></details>`}).join('')}</article><div><article class="panel"><h3>评分过程</h3><p class="small muted">1. 只读取被评分 DOCX 的可见正文。<br>2. 将正文与 QC 问题交给 judge。<br>3. 标准答案不放入 judge 提示。<br>4. 官方函数比较 10 个选项，正确数 ÷ 10。</p><div class="stats-inline"><span>judge 工具调用 0</span><span>答卷 ${g.details.storyboard_character_count.toLocaleString()} 字符</span><span>${g.evaluation_elapsed_s.toFixed(1)} 秒评审</span></div><div class="buttons">${link(c.files.grade,'评分 JSON')}${link(c.files.evaluator,'官方评分源码')}</div></article><details class="closed-note"><summary>发给 judge 的完整提示</summary>${pre(c.judge_prompt,'original')}${link(c.files.judge_prompt,'下载 judge 提示')}</details><details class="closed-note"><summary>judge 原始 JSON 响应</summary>${pre(c.judge_raw)}${link(c.files.judge_response,'下载原始响应')}</details><details class="closed-note"><summary>judge 运行配置</summary>${pre(pretty(c.judge_run))}</details></div></div>`;

行轨迹”中都可切换查看这次环境异常记录。</p></article><article class="panel"><h2>不能由本次审计证明的事</h2><ul class="limits"><li>未采集抓包、全系统进程联网和完整文件访问审计；不能声称物理断网或彻底排除宿主层访问。</li><li>没有使用完全隔离的官方虚拟机。调度端可以访问官方评分源码，但没有把它放入答题提示或输入目录。</li><li>公开题目、电影或相近内容可能被模型预训练见过；行为日志不能排除记忆性知识。</li><li>本次高分只代表现有评分器的覆盖范围；镜头日志 judge 也已按要求换为 6.1 Sol。</li></ul></article></div><details class="closed-note"><summary>逐脚本静态检查证据</summary>${pre(pretty(a.cases.map(c=>({task_id:c.task_id,scripts:c.generated_scripts,suspicious_command_matches:c.suspicious_command_matches}))))}</details>`}
document.addEventListener('click',event=>{const b=event.target.closest('[data-case],[data-tab],[data-filter],[data-seek],[data-evidence],[data-zoom]');if(b){if(b.dataset.case!==undefined)setCase(Number(b.dataset.case));else if(b.dataset.tab)setTab(b.dataset.tab);else if(b.dataset.filter){state.traceType=b.dataset.filter;renderView()}else if(b.dataset.seek){const [m,s]=b.dataset.seek.split(':').map(Number);const v=$('#sourcePlayer');v.currentTime=m*60+s;v.scrollIntoView({behavior:'smooth',block:'center'})}else if(b.dataset.evidence){state.segmentQuery=b.dataset.evidence;state.tab='result';render();$('#segmentSearch').scrollIntoView({behavior:'smooth',block:'center'});if(!$('#segments .segment')){state.segmentQuery=b.dataset.evidence.split(' ').slice(0,5).join(' ');$('#segmentSearch').value=state.segmentQuery;renderSegments()}}else if(b.dataset.zoom){$('#dialogImage').src=b.dataset.zoom;$('#imageDialog').showModal()}}if(event.target.id==='expandTrace'){state.expand=!state.expand;renderView()}if(event.target.id==='toggleInvalid'){state.invalid=!state.invalid;state.traceType='all';state.traceQuery='';renderView()}});
document.addEventListener('input',event=>{if(event.target.id==='segmentSearch'){state.segmentQuery=event.target.value;renderSegments()}if(event.target.id==='traceSearch'){state.traceQuery=event.target.value;renderTraceList()}});
$('#closeDialog').onclick=()=>$('#imageDialog').close();$('#imageDialog').onclick=e=>{if(e.target===$('#imageDialog'))$('#imageDialog').close()};$('#auditNav').onclick=()=>setTab('audit');$('#tabs').addEventListener('keydown',ev=>{if(!['ArrowLeft','ArrowRight'].includes(ev.key))return;ev.preventDefault();let i=tabs.findIndex(t=>t[0]===state.tab);i=(i+(ev.key==='ArrowRight'?1:-1)+tabs.length)%tabs.length;setTab(tabs[i][0]);document.querySelector(`[data-tab="${tabs[i][0]}"]`).focus()});render();
